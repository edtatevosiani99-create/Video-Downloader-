name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build current yt-dlp Android library
        run: |
          git clone --depth 1 https://github.com/ffmpegkit-maintained/yt-dlp-android.git /tmp/yt-dlp-android
          cd /tmp/yt-dlp-android
          gradle publishToMavenLocal
      - name: Build debug APK with refreshed extractor
        run: gradle --refresh-dependencies assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Video Downloader APK
          body: |
            Automatically built Android APK from the latest main branch.
            Includes the latest yt-dlp extractor built from upstream source.
            This is a debug-signed build. Android may show a warning when installing apps from outside the Play Store.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
