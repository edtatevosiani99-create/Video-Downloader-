name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build current yt-dlp Android library
        run: |
          git clone --depth 1 https://github.com/ffmpegkit-maintained/yt-dlp-android.git /tmp/yt-dlp-android
          cd /tmp/yt-dlp-android
          python - <<'PY'
          from pathlib import Path
          p = Path("library/src/main/python/ytdlp_runner.py")
          s = p.read_text()
          # Ensure Java CLI-style options are forwarded to yt-dlp's Python API.
          additions = {
              "--extractor-args": "('_extractor_args', True)",
              "--socket-timeout": "('_socket_timeout', True)",
              "--retries": "('_retries', True)",
              "--fragment-retries": "('_fragment_retries', True)",
              "--extractor-retries": "('_extractor_retries', True)",
              "--verbose": "('verbose', False)",
          }
          anchor = "    '--proxy':"
          for flag, mapping in additions.items():
              entry = f"    '{flag}': {mapping},\n"
              if f"'{flag}':" not in s:
                  if anchor not in s:
                      raise SystemExit(f"Could not patch yt-dlp flag map: {flag}")
                  s = s.replace(anchor, entry + anchor, 1)
          handler_lines = [
              "            elif key == '_socket_timeout':",
              "                opts['socket_timeout'] = float(val)",
              "            elif key in ('_retries', '_fragment_retries', '_extractor_retries'):",
              "                opts[key[1:]] = int(val)",
              "            elif key == '_extractor_args':",
              "                section, sep, raw_args = val.partition(':')",
              "                if sep and section:",
              "                    section_args = opts.setdefault('extractor_args', {}).setdefault(section, {})",
              "                    for item in raw_args.split(','):",
              "                        arg_name, equals, arg_value = item.partition('=')",
              "                        if equals and arg_name and arg_value:",
              "                            section_args.setdefault(arg_name, []).extend(arg_value.split('+'))",
          ]
          if "elif key == '_extractor_args':" not in s:
              anchor = "            elif key == '_audio_format':"
              if anchor not in s:
                  raise SystemExit("Could not patch extractor-args parser")
              s = s.replace(anchor, "\n".join(handler_lines) + "\n" + anchor, 1)
          p.write_text(s)
          PY
          gradle :library:assembleRelease :library:generatePomFileForMavenPublication
          m2="$HOME/.m2/repository/dev/ffmpegkit-maintained/yt-dlp-android/2.0.2"
          mkdir -p "$m2"
          cp library/build/outputs/aar/yt-dlp-android-release.aar "$m2/yt-dlp-android-2.0.2.aar"
          cp library/build/publications/maven/pom-default.xml "$m2/yt-dlp-android-2.0.2.pom"
      - name: Build debug APK with refreshed extractor
        run: gradle --refresh-dependencies assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Video Downloader APK
          body: |
            Automatically built Android APK from the latest main branch.
            Includes the current yt-dlp extractor and fixed CLI-argument forwarding.
            This is a debug-signed build. Android may show a warning when installing apps from outside the Play Store.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
