plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videodownloader.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.videodownloader.app'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '1.4.0'
    }
}

configurations.configureEach {
    // Avoid duplicate legacy Android Support media classes conflicting with AndroidX Media3.
    exclude group: 'com.android.support', module: 'support-media-compat'
}

dependencies {
    // Media3 ExoPlayer provides more reliable hardware video decoding than Android VideoView.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'dev.ffmpegkit-maintained:yt-dlp-android:2.0.2'
    // FFmpeg provides reliable MP3 encoding and normalizes downloaded video for Android playback.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    implementation('com.github.naman14:TAndroidLame:1.1') {
        exclude group: 'com.android.support', module: 'support-compat'
    }
}
